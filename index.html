<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MinIO Multipart Upload - Direct Upload</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #f1f5f9;
      padding: 2rem;
      margin: 0;
    }
    .card {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    h1 { margin-top: 0; }
    label {
      font-weight: 600;
      display: block;
      margin: 1rem 0 0.5rem;
    }
    input, select {
      width: 100%;
      padding: 0.5rem;
      border-radius: 0.5rem;
      border: 1px solid #cbd5e1;
    }
    .btn-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    button.danger { background: #ef4444; }
    button.secondary { background: #64748b; }
    .log {
      background: #0f172a;
      color: #e2e8f0;
      padding: 1rem;
      border-radius: 0.5rem;
      font-family: monospace;
      font-size: 0.8rem;
      height: 300px;
      overflow-y: auto;
      margin-top: 1rem;
    }
    .log .err { color: #ff9999; }
    .log .warn { color: #fcd34d; }
    .log .ok { color: #86efac; }
    .progress-wrap { margin: 1rem 0 0.25rem; display: none; }
    .progress-bar {
      background: #e2e8f0;
      border-radius: 10px;
      height: 14px;
      overflow: hidden;
    }
    .progress-fill {
      background: #3b82f6;
      width: 0%;
      height: 100%;
      border-radius: 10px;
      transition: width 0.2s;
    }
    #stats {
      font-size: 0.85rem;
      color: #475569;
      margin-top: 0.3rem;
    }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 0.4rem;
    }
    .badge.idle { background: #e2e8f0; color: #475569; }
    .badge.running { background: #dbeafe; color: #1d4ed8; }
    .badge.done { background: #dcfce7; color: #166534; }
    .badge.failed { background: #fee2e2; color: #991b1b; }
    #result {
      margin-top: 0.75rem;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      display: none;
    }
    #result.success { background: #dcfce7; color: #166534; }
    #result.error { background: #fee2e2; color: #991b1b; }
    .file-info {
      background: #f8fafc;
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: #334155;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 MinIO Multipart Upload <span id="statusBadge" class="badge idle">Idle</span></h1>

    <label>🌐 Backend URL</label>
    <input type="text" id="baseUrl" value="http://localhost:9000" />

    <label>🔑 Bearer Token</label>
    <input type="text" id="token" placeholder="Your JWT token" />

    <label>📄 Choose File (Large video supported)</label>
    <input type="file" id="fileInput" />
    <div id="fileInfo" class="file-info"></div>

    <label>⚙️ Chunk Size (MB) - Recommended: 10MB for MinIO (minimum 5MB)</label>
    <input type="number" id="chunkSizeMb" value="10" step="1" min="5" max="100" />

    <div class="btn-row">
      <button id="uploadBtn" disabled>⬆ Start Upload</button>
      <button id="abortBtn" class="danger" disabled>❌ Abort</button>
      <button id="statusBtn" class="secondary">📊 Check Status</button>
      <button id="clearBtn" class="secondary">🗑 Clear Log</button>
    </div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <div id="stats"></div>
    </div>

    <div id="result"></div>
    <div class="log" id="log"><div>✨ Ready - Select a file and start upload</div></div>
  </div>

  <script>
    // DOM elements
    const $ = id => document.getElementById(id);
    const baseUrlInput = $('baseUrl');
    const tokenInput = $('token');
    const fileInput = $('fileInput');
    const chunkSizeInput = $('chunkSizeMb');
    const uploadBtn = $('uploadBtn');
    const abortBtn = $('abortBtn');
    const statusBtn = $('statusBtn');
    const clearBtn = $('clearBtn');
    const progressWrap = $('progressWrap');
    const progressFill = $('progressFill');
    const statsDiv = $('stats');
    const logDiv = $('log');
    const fileInfoDiv = $('fileInfo');
    const resultDiv = $('result');
    const statusBadge = $('statusBadge');

    // State
    let currentSessionId = null;
    let currentUploadId = null;
    let currentFile = null;
    let isUploading = false;
    let abortRequested = false;

    function log(msg, type = 'info') {
      const line = document.createElement('div');
      const time = new Date().toLocaleTimeString();
      line.textContent = `[${time}] ${msg}`;
      if (type === 'error') line.classList.add('err');
      else if (type === 'warn') line.classList.add('warn');
      else if (type === 'ok') line.classList.add('ok');
      logDiv.appendChild(line);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function setBadge(state) {
      statusBadge.className = `badge ${state}`;
      const labels = { idle: 'Idle', running: 'Uploading…', done: 'Done', failed: 'Failed' };
      statusBadge.textContent = labels[state] ?? state;
    }

    function setProgress(uploaded, total) {
      const pct = total > 0 ? Math.round((uploaded / total) * 100) : 0;
      progressFill.style.width = `${pct}%`;
      statsDiv.textContent = `${pct}% · ${uploaded} / ${total} parts`;
    }

    function showResult(msg, success) {
      resultDiv.textContent = msg;
      resultDiv.className = success ? 'success' : 'error';
      resultDiv.style.display = 'block';
      setTimeout(() => {
        if (resultDiv.style.display === 'block') {
          resultDiv.style.opacity = '0.5';
          setTimeout(() => {
            resultDiv.style.display = 'none';
            resultDiv.style.opacity = '1';
          }, 3000);
        }
      }, 5000);
    }

    function getHeaders(json = false) {
      const token = tokenInput.value.trim();
      const headers = {};
      if (json) headers['Content-Type'] = 'application/json';
      if (token) {
        headers['Authorization'] = token.startsWith('Bearer ') ? token : `Bearer ${token}`;
      }
      return headers;
    }

    function baseUrl() { 
      return baseUrlInput.value.trim().replace(/\/$/, ''); 
    }

    function resetState() {
      currentSessionId = null;
      currentUploadId = null;
      abortRequested = false;
      isUploading = false;
      uploadBtn.disabled = !currentFile;
      abortBtn.disabled = true;
      progressWrap.style.display = 'none';
      setProgress(0, 0);
      setBadge('idle');
    }

    // Check upload status
    statusBtn.addEventListener('click', async () => {
      if (!currentSessionId) {
        log('No active upload session', 'warn');
        return;
      }
      
      try {
        const res = await fetch(`${baseUrl()}/api/uploads/${currentSessionId}/status`, {
          headers: getHeaders(),
        });
        
        if (!res.ok) throw new Error('Failed to get status');
        const data = await res.json();
        
        log(`📊 Status: ${data.status} | Progress: ${data.progress?.toFixed(1)}% (${data.uploadedParts}/${data.totalParts} parts)`, 'ok');
        showResult(`Status: ${data.status} - ${data.progress?.toFixed(1)}% complete`, true);
      } catch (err) {
        log(`Failed to get status: ${err.message}`, 'error');
      }
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) {
        currentFile = null;
        fileInfoDiv.style.display = 'none';
        uploadBtn.disabled = true;
        return;
      }
      currentFile = file;
      const mb = (file.size / 1024 / 1024).toFixed(2);
      fileInfoDiv.style.display = 'block';
      fileInfoDiv.innerHTML = `<strong>${file.name}</strong> · ${mb} MB · ${file.type || 'unknown'}`;
      uploadBtn.disabled = isUploading;
      resultDiv.style.display = 'none';
      log(`📎 Selected: ${file.name} (${mb} MB)`);
    });

    clearBtn.addEventListener('click', () => {
      logDiv.innerHTML = '<div>🗑 Log cleared.</div>';
      resultDiv.style.display = 'none';
    });

    abortBtn.addEventListener('click', async () => {
      if (!currentSessionId) return;
      abortRequested = true;
      log(`⛔ Aborting session ${currentSessionId}...`, 'warn');
      try {
        const res = await fetch(`${baseUrl()}/api/uploads/minio/${currentSessionId}`, {
          method: 'DELETE',
          headers: getHeaders(),
        });
        const data = await res.json();
        if (res.ok) {
          log(`✅ ${data.message || 'Aborted successfully'}`, 'ok');
        } else {
          log(`❌ Abort failed: ${data.message}`, 'error');
        }
      } catch (err) {
        log(`Abort error: ${err.message}`, 'error');
      }
      showResult('Upload aborted', false);
      resetState();
    });

    uploadBtn.addEventListener('click', async () => {
      if (isUploading || !currentFile) return;

      const chunkMB = parseFloat(chunkSizeInput.value);
      if (!chunkMB || chunkMB < 5) {
        log('❌ Chunk size must be at least 5MB for MinIO', 'error');
        return;
      }

      const chunkBytes = chunkMB * 1024 * 1024;
      const totalBytes = currentFile.size;
      const totalParts = Math.ceil(totalBytes / chunkBytes);

      isUploading = true;
      abortRequested = false;
      uploadBtn.disabled = true;
      abortBtn.disabled = false;
      progressWrap.style.display = 'block';
      resultDiv.style.display = 'none';
      setBadge('running');
      setProgress(0, totalParts);

      log(`🚀 Starting MinIO multipart upload: ${totalParts} chunks of ${chunkMB}MB`);
      log(`📡 Backend: ${baseUrl()}`);

      // STEP 1: Initiate upload in MinIO
      try {
        log(`📡 POST /api/uploads/minio/initiate`);
        const initRes = await fetch(`${baseUrl()}/api/uploads/minio/initiate`, {
          method: 'POST',
          headers: getHeaders(true),
          body: JSON.stringify({
            fileName: currentFile.name,
            mimeType: currentFile.type || 'application/octet-stream',
            fileSize: currentFile.size,
          }),
        });

        const initData = await initRes.json();
        if (!initRes.ok) throw new Error(initData.message || 'Init failed');

        currentSessionId = initData.sessionId;
        currentUploadId = initData.uploadId;
        log(`✅ Session created: ${currentSessionId}`, 'ok');
        log(`📦 Upload ID: ${currentUploadId}`);

        // STEP 2: Upload each chunk directly to MinIO via presigned URLs
        const uploadedParts = [];

        for (let partNum = 1; partNum <= totalParts; partNum++) {
          if (abortRequested) {
            log('🛑 Upload cancelled by user', 'warn');
            resetState();
            return;
          }

          // Get presigned URL for this part
          log(`🔗 Getting presigned URL for part ${partNum}...`);
          const presignRes = await fetch(
            `${baseUrl()}/api/uploads/minio/${currentSessionId}/presigned-url/${partNum}`,
            { headers: getHeaders() }
          );
          
          if (!presignRes.ok) {
            const errData = await presignRes.json();
            throw new Error(`Failed to get presigned URL: ${errData.message}`);
          }
          
          const { url } = await presignRes.json();
          if (!url) throw new Error('No presigned URL received');

          // Extract chunk from file
          const start = (partNum - 1) * chunkBytes;
          const end = Math.min(start + chunkBytes, totalBytes);
          const chunk = currentFile.slice(start, end);

          log(`📤 Uploading part ${partNum}/${totalParts} (${Math.round(chunk.size / 1024)} KB) directly to MinIO...`);

          // Upload directly to MinIO with retry
          let uploadSuccess = false;
          let etag = '';
          
          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              const uploadRes = await fetch(url, {
                method: 'PUT',
                body: chunk,
                headers: { 'Content-Type': 'application/octet-stream' },
              });
              
              if (uploadRes.ok) {
                etag = uploadRes.headers.get('ETag') || '';
                uploadSuccess = true;
                log(`✅ Part ${partNum} uploaded successfully (ETag: ${etag.substring(0, 20)}...)`, 'ok');
                break;
              } else {
                throw new Error(`HTTP ${uploadRes.status}`);
              }
            } catch (err) {
              if (attempt === 3) throw err;
              log(`⚠️ Part ${partNum} attempt ${attempt} failed: ${err.message}, retrying...`, 'warn');
              await new Promise(r => setTimeout(r, 1000 * attempt));
            }
          }

          if (!uploadSuccess) {
            throw new Error(`Failed to upload part ${partNum} after 3 attempts`);
          }

          // Save ETag to backend
          log(`💾 Saving ETag for part ${partNum}...`);
          const saveRes = await fetch(`${baseUrl()}/api/uploads/minio/${currentSessionId}/part/complete`, {
            method: 'POST',
            headers: getHeaders(true),
            body: JSON.stringify({ partNumber: partNum, eTag: etag }),
          });
          
          if (!saveRes.ok) {
            const errData = await saveRes.json();
            throw new Error(`Failed to save ETag: ${errData.message}`);
          }

          uploadedParts.push({ partNumber: partNum, eTag: etag });
          setProgress(partNum, totalParts);
        }

        // STEP 3: Complete multipart upload
        log(`🔗 Completing multipart upload with ${uploadedParts.length} parts...`);
        const completeRes = await fetch(`${baseUrl()}/api/uploads/minio/${currentSessionId}/complete`, {
          method: 'POST',
          headers: getHeaders(true),
        });

        const completeData = await completeRes.json();
        if (!completeRes.ok) throw new Error(completeData.message || 'Complete failed');

        log(`🎉 Upload complete! File URL: ${completeData.url}`, 'ok');
        showResult(`✅ Upload successful! File: ${completeData.url}`, true);
        setProgress(totalParts, totalParts);
        setBadge('done');

      } catch (err) {
        log(`❌ Upload failed: ${err.message}`, 'error');
        showResult(`Upload failed: ${err.message}`, false);
        setBadge('failed');
        
        // Cleanup on failure
        if (currentSessionId) {
          log(`🧹 Cleaning up failed session...`);
          try {
            await fetch(`${baseUrl()}/api/uploads/minio/${currentSessionId}`, {
              method: 'DELETE',
              headers: getHeaders(),
            });
            log(`✅ Cleanup completed`, 'ok');
          } catch (e) {
            log(`Cleanup failed: ${e.message}`, 'warn');
          }
        }
      } finally {
        currentSessionId = null;
        currentUploadId = null;
        isUploading = false;
        uploadBtn.disabled = !!currentFile;
        abortBtn.disabled = true;
      }
    });
  </script>
</body>
</html>
